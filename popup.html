<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 12px;
      background-color: #1e1f22; /* Discord Sidebar Dark */
      font-family: 'gg sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #dbdee1; /* Discord Main Text */
      overflow: hidden;
    }

    .app-container {
      position: relative;
      background-color: #2b2d31; /* Discord Channel Center Dark */
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .banner-view {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 10px;
      display: block;
      background-color: #000;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #35363c;
      padding-bottom: 8px;
    }

    .brand-title {
      font-size: 12px;
      font-weight: 800;
      color: #f2f3f5;
      letter-spacing: 0.5px;
    }

    .action-controls {
      display: flex;
      gap: 6px;
    }

    .control-btn {
      width: 26px;
      height: 26px;
      background-color: #313338;
      border: none;
      border-radius: 4px;
      color: #b5bac1;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, color 0.2s;
    }

    .control-btn:hover {
      background-color: #35373c;
      color: #f2f3f5;
    }

    .notification-banner {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background-color: #23a55a; /* Discord Success Green */
      color: #ffffff;
      font-size: 10px;
      font-weight: 600;
      text-align: center;
      padding: 4px 0;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
      display: none;
      z-index: 10;
    }

    label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      color: #b5bac1;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea, input {
      width: 100%;
      box-sizing: border-box;
      background-color: #1e1f22;
      border: none;
      border-radius: 4px;
      color: #dbdee1;
      font-size: 12px;
      padding: 8px;
      margin-bottom: 12px;
      outline: none;
    }

    textarea {
      resize: none;
    }

    /* Toggle Switch Container */
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #1e1f22;
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .toggle-label-text {
      font-size: 11px;
      font-weight: 700;
      color: #b5bac1;
      text-transform: uppercase;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }

    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #4e5058;
      transition: .3s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #23a55a;
    }

    input:checked + .slider:before {
      transform: translateX(14px);
    }

    .main-switches {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .switch-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      text-transform: uppercase;
    }

    .switch-btn:disabled {
      background-color: #4f545c !important;
      color: #72767d !important;
      cursor: not-allowed;
    }

    .btn-launch {
      background-color: #5865f2; /* Discord Blurple */
      color: #ffffff;
    }

    .btn-launch:hover:not(:disabled) {
      background-color: #4752c4;
    }

    .btn-running {
      background-color: #23a55a;
      color: #ffffff;
    }

    .btn-halt {
      background-color: #da373c; /* Discord Danger Red */
      color: #ffffff;
    }

    .btn-halt:hover:not(:disabled) {
      background-color: #a92b2f;
    }

    .status-ticker {
      font-size: 10px;
      color: #949ba4;
      text-align: center;
      padding-top: 4px;
      border-top: 1px solid #35363c;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="notification-banner" id="statusNotice">Success</div>

    <video src="banner.mp4" class="banner-view" autoplay loop muted playsinline></video>

    <div class="top-bar">
      <div class="brand-title">👑 KABIR DISCORD RULER</div>
      <div class="action-controls">
        <input type="file" id="fileLoader" accept=".txt" style="display: none;">
        <button class="control-btn" id="uploadTrigger" title="Load Text File">📁</button>
        <button class="control-btn" id="devLink" title="Support Profile">🔗</button>
      </div>
    </div>

    <label>🎯 Subject Name</label>
    <input type="text" id="subjectName" placeholder="Enter name to replace [Subject]">

    <label>💬 Messages (One per line)</label>
    <textarea id="textQueue" rows="4" placeholder="Hello [Subject]!&#10;textart{&#10; ⠀⠀⣴⠶⢦⣤⠶⠶⣄⠀⠀&#10; ⠀⠀⣇⠀♥️⠀⢀⣿⠀⠀&#10;}textart"></textarea>

    <!-- Text Art Mode Configuration Toggle -->
    <div class="toggle-container">
      <span class="toggle-label-text">🎨 Text Art Mode (Keep Blocks Intact)</span>
      <label class="switch">
        <input type="checkbox" id="textArtModeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Mode Configuration Toggle -->
    <div class="toggle-container">
      <span class="toggle-label-text">💥 Burst Mode (Send All at Once)</span>
      <label class="switch">
        <input type="checkbox" id="burstModeToggle">
        <span class="slider"></span>
      </label>
    </div>

    <label>⏱️ Message Delay (Seconds / Ignored in Burst)</label>
    <input type="number" id="delayConfig" value="30" min="1">

    <div class="main-switches">
      <button id="initiateBtn" class="switch-btn btn-launch" disabled>Run Engine</button>
      <button id="terminateBtn" class="switch-btn btn-halt">Stop</button>
    </div>

    <div class="status-ticker" id="systemLog">Awaiting operations...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
